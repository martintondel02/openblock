# REUSE metadata (https://reuse.software/spec-3.3/).
# Individual files may also carry SPDX headers; this file covers groups.
version = 1

[[annotations]]
path = [
  "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
  "CODE_OF_CONDUCT.md", "MAINTAINERS.md", "Cargo.lock", "dev-cargo",
  "docs/**", "crates/*/Cargo.toml", "crates/*/src/**", "crates/*/tests/**",
  "crates/*/benches/**", "crates/*/examples/**", "xtask/**", "perf/**", "packs/**", "justfile",
  "Cargo.toml", "rust-toolchain.toml", "rustfmt.toml", "deny.toml",
  "architecture.toml", "REUSE.toml",
  ".github/**", ".editorconfig", ".markdownlint.jsonc", ".gitignore",
  ".dockerignore", "scripts/**",
]
SPDX-FileCopyrightText = "2026 OpenBlock contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The DCO is standard text: it may be copied verbatim but not modified.
# REUSE 3.3 needs a custom license reference for that permission.
[[annotations]]
path = ["DCO", "LICENSES/LicenseRef-DCO-1.1.txt"]
SPDX-FileCopyrightText = "2004, 2006 The Linux Foundation and its contributors"
SPDX-License-Identifier = "LicenseRef-DCO-1.1"

# Packaging is MIT OR Apache-2.0 except the project icon, which is CC0-1.0.
# The icon is listed separately because a broad "packaging/**" annotation would
# give the same file two licenses.
[[annotations]]
path = [
  "packaging/README.md",
  "packaging/container/**",
  "packaging/fedora/io.github.martintondel02.OpenBlock.desktop",
  "packaging/fedora/openblock.mime.xml",
  "packaging/fedora/openblock.metainfo.xml",
  "packaging/fedora/openblock-server.firewalld.xml",
  "packaging/fedora/openblock.spec",
  "packaging/flatpak/**",
  "packaging/systemd/**",
]
SPDX-FileCopyrightText = "2026 OpenBlock contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["packaging/fedora/io.github.martintondel02.OpenBlock.svg"]
SPDX-FileCopyrightText = "2026 OpenBlock contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["LICENSE-MIT", "LICENSES/MIT.txt"]
SPDX-FileCopyrightText = "2026 OpenBlock contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["LICENSE-APACHE", "LICENSES/Apache-2.0.txt"]
SPDX-FileCopyrightText = "Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# FSR 1.0 EASU/RCAS WGSL ports and their license text are AMD-derived MIT
# software. The broad annotation above deliberately lists crate sources rather
# than `crates/**` so this directory is not also claimed as MIT OR Apache-2.0.
# The full MIT text is kept in the directory as LICENSE-FSR.txt and is also
# reproduced in crates/render/src/fsr.rs.
[[annotations]]
path = ["crates/render/assets/fsr/**"]
SPDX-FileCopyrightText = "2021 Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# Bundled Minecraft-style UI font (Monocraft) is third-party software under the
# SIL Open Font License 1.1; it lives outside crates/** so the broad annotation
# above does not claim it as MIT/Apache-2.0. The unmodified OFL text is included.
[[annotations]]
path = ["assets/ui-font/Monocraft.ttf", "assets/ui-font/OFL.txt"]
SPDX-FileCopyrightText = "Copyright (c) 2022, Idrees Hassan (https://github.com/IdreesInc/Monocraft)"
SPDX-License-Identifier = "OFL-1.1"
