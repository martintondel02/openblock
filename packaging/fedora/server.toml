# Installed as /etc/openblock-server/server.toml by the openblock-server RPM.
# Editing this file requires `systemctl restart openblock-server` (class: restart).
# Full schema: docs/spec/19-server-administration.md
[server]
name = "OpenBlock Server"
motd = "Welcome to OpenBlock"
# identity is generated on first start under the state directory; no PKI required.
bind = "0.0.0.0"
port = 25565
max_players = 20

[world]
name = "world"
# Render and simulation distance are equal by default (DEC-052).
distance_blocks = 256

[backups]
enabled = true
interval_minutes = 60
keep = 7

[logging]
level = "info"
format = "json"

[console]
local = true
# Remote console and RPC are off by default and must use TLS if enabled.
remote = false
