name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CONTRIBUTING.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "README.md", "CONTRIBUTING.md"]
  workflow_dispatch:

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments "docs/**/*.md" "README.md" "CONTRIBUTING.md"
          fail: true
