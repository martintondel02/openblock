name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CONTRIBUTING.md", ".github/workflows/docs.yml", ".github/scripts/**"]
  pull_request:
    paths: ["docs/**", "README.md", "CONTRIBUTING.md", ".github/scripts/**"]
  workflow_dispatch:

# Read-only workflow token; this workflow only checks out and validates docs.
permissions:
  contents: read

jobs:
  consistency:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Links, chapter structure, requirement ids, decision citations
        run: python3 .github/scripts/check-docs.py
