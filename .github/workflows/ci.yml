name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_container:
        description: Build the full server container image (slow, manual only)
        type: boolean
        default: false
      run_reliability:
        description: Run the 15-minute reliability audit (restart/churn/soak/SIGTERM)
        type: boolean
        default: false

# Least privilege: no job writes repository contents, so the workflow token is
# read-only. This also limits fork pull requests; this workflow deliberately
# does not use pull_request_target. Action refs are major tags kept current by
# Dependabot; SHA-pinning third-party actions is a tracked 1.0.1 hardening item
# (docs/plan/1.0.1-audit.md) before accepting untrusted contributions at scale.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Headless host smoke test
        run: cargo run --release --locked -p ob_server --bin openblock-server -- --smoke --data-dir target/smoke --seed 42
      - name: Offscreen render smoke test (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
          cargo run --release --locked -p ob_client --bin openblock -- --screenshot target/screenshot.png --seed 42 --fly --render-distance 4
          test -s target/screenshot.png
          bytes=$(wc -c < target/screenshot.png)
          echo "screenshot bytes: $bytes"
          test "$bytes" -gt 5000
          cargo run --release --locked -p ob_client --bin openblock -- --screenshot target/screenshot-settings-audio.png --seed 42 --fly --render-distance 4 --screenshot-settings=audio
          test -s target/screenshot-settings-audio.png
          bytes=$(wc -c < target/screenshot-settings-audio.png)
          echo "audio settings screenshot bytes: $bytes"
          test "$bytes" -gt 5000
      - name: Offscreen benchmark gate (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
          cargo run --release --locked -p ob_tools --bin openblock-tools -- bench --frames 30 --width 640 --height 360 --seed 42 --render-distance 6 --data-dir target/bench-data --json target/bench.json --max-frame-ms 2000
      - name: Save size guard
        if: matrix.os == 'ubuntu-latest'
        # The 169-chunk reference world is ~49 KiB compressed. Fail loudly if
        # compression or light storage regresses by an order of magnitude.
        run: |
          save=$(find target/smoke -name world.obs | head -1)
          test -n "$save"
          bytes=$(stat -c %s "$save")
          echo "save size: $bytes bytes ($save)"
          test "$bytes" -lt 5000000
      - name: Ops backup/restore test
        if: matrix.os == 'ubuntu-latest'
        # Non-root, uses the release binary built by the smoke step above.
        run: OPENBLOCK_SERVER="$PWD/target/release/openblock-server" bash scripts/tests/test-backup-restore.sh
      - name: Docs
        if: matrix.os == 'ubuntu-latest'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  fedora:
    # Primary platform (DEC-054): Fedora 44/45 are required matrix entries.
    name: Linux (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: ["44", "45"]
    steps:
      - name: Install build dependencies
        run: >
          dnf -y install gcc gcc-c++ make git tar gzip curl which python3
          pkgconf-pkg-config wayland-devel libxkbcommon-devel
          vulkan-loader-devel fontconfig-devel freetype-devel systemd-devel
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and test
        env:
          # Fedora container images have no GPU; some have an unstable software
          # Vulkan that segfaults wgpu adapter enumeration. Skip GPU tests there;
          # Ubuntu CI covers the offscreen render path with lavapipe.
          OPENBLOCK_NO_GPU_TESTS: "1"
        run: cargo test --workspace --all-targets
      - name: Headless host smoke test
        run: cargo run --release --locked -p ob_server --bin openblock-server -- --smoke --data-dir target/smoke --seed 42
      - name: Architecture guard
        run: .github/scripts/check-arch.sh
      - name: Documentation consistency
        run: python3 .github/scripts/check-docs.py
      - name: Validate Fedora packaging metadata
        run: |
          dnf -y install desktop-file-utils appstream systemd
          desktop-file-validate packaging/fedora/io.github.martintondel02.OpenBlock.desktop
          appstreamcli validate --no-net packaging/fedora/openblock.metainfo.xml
          install -Dm755 /bin/true /usr/bin/openblock-server
          systemd-sysusers packaging/systemd/openblock-server.sysusers
          systemd-tmpfiles --create packaging/systemd/openblock-server.tmpfiles
          install -Dm644 packaging/systemd/server.toml /etc/openblock/server.toml
          systemd-analyze --man=no verify packaging/systemd/openblock-server.service

  server-deps:
    name: Server dependency and ops-script policy
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Server has no GPU/window/audio dependencies
        run: bash scripts/check-server-deps.sh
      - name: Ops scripts parse
        run: |
          bash -n scripts/server-backup.sh
          bash -n scripts/server-restore.sh
          bash -n scripts/check-server-deps.sh
          bash -n scripts/tests/test-backup-restore.sh
          python3 -m py_compile scripts/load-test.py scripts/load-gate.py scripts/reliability-audit.py

  container:
    name: Container manifests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Dockerfile
        run: |
          if docker build --help 2>&1 | grep -q -- '--check'; then
            docker build --check -f packaging/container/Dockerfile .
          else
            echo "docker build --check is unavailable on this runner; syntax check skipped"
          fi
      - name: Validate Compose file
        run: docker compose -f packaging/container/docker-compose.yml config --quiet

  container-image:
    # A cold image build compiles the workspace for musl and is intentionally
    # manual: run the workflow with build_container=true. Push/PR CI still lints
    # the Dockerfile and Compose file above.
    name: Container image (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.build_container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build server image
        run: docker build -t openblock-server:ci -f packaging/container/Dockerfile .
      - name: Smoke the image
        run: |
          docker run --rm openblock-server:ci --version
          docker image inspect openblock-server:ci --format 'User={{.Config.User}} Size={{.Size}}'
          docker run --rm --entrypoint sh openblock-server:ci             -c 'ldd /usr/local/bin/openblock-server 2>&1 | grep -Ei "vulkan|X11|wayland|pulse|asound|libGL" && exit 1 || exit 0'

  bench:
    name: CPU benchmarks (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build benchmark tools
        run: cargo build --release --locked -p ob_tools --bins
      # The quick profiles are budgeted at well under 60 s of run time in
      # total; they assert determinism, invariants and the save/reload hash,
      # never wall-clock thresholds on a shared CI runner.
      - name: Worldgen benchmark (quick)
        run: cargo run --release --locked -p ob_tools --bin worldgen_bench -- --quick --csv target/bench-worldgen.csv --markdown target/bench-worldgen.md
      - name: Server simulation benchmark (quick)
        run: cargo run --release --locked -p ob_tools --bin server_bench -- --quick --csv target/bench-server.csv --markdown target/bench-server.md
      - name: Save/persistence benchmark (quick)
        run: cargo run --release --locked -p ob_tools --bin save_bench -- --quick --phases --csv target/bench-save.csv --markdown target/bench-save.md
      - name: Soak smoke (quick)
        run: cargo run --release --locked -p ob_tools --bin soak -- --quick --csv target/bench-soak.csv --markdown target/bench-soak.md
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-benchmark-reports
          path: |
            target/bench-worldgen.csv
            target/bench-worldgen.md
            target/bench-server.csv
            target/bench-server.md
            target/bench-save.csv
            target/bench-save.md
            target/bench-soak.csv
            target/bench-soak.md
          if-no-files-found: ignore

  load-gate:
    name: Multiplayer load gate (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build headless server
        run: cargo build --release --locked -p ob_server --bin openblock-server
      # 4 loopback protocol-v2 bots for 12 s. Functional checks (joins,
      # interest sets, chunks, edits, pongs) always gate; the 35 ms tick target
      # is reported as advisory on a shared runner unless --enforce-quick is
      # passed. No GPU, no window, temp data dir and ephemeral port.
      - name: Quick load gate
        run: |
          python3 scripts/load-gate.py --quick --wait-interest \
            --binary target/release/openblock-server \
            --json target/load-gate.json --markdown target/load-gate.md
      - name: Upload load-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-gate-report
          path: |
            target/load-gate.json
            target/load-gate.md
          if-no-files-found: ignore

  reliability:
    # Manual pre-release lane: the full audit takes ~15 minutes (300 s soak,
    # 60 s churn, 20 restart cycles, SIGTERM/corruption/disk probes), so it is
    # opt-in rather than a per-PR cost. Functional failures exit non-zero.
    name: Reliability audit (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_reliability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build headless server
        run: cargo build --release --locked -p ob_server --bin openblock-server
      - name: Reliability audit
        run: |
          python3 scripts/reliability-audit.py \
            --binary target/release/openblock-server \
            --cycles 20 --churn-seconds 60 --soak-seconds 300 \
            --sigterm-iterations 10 \
            --json target/reliability.json \
            --markdown target/reliability.md
      - name: Upload reliability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-report
          path: |
            target/reliability.json
            target/reliability.md
          if-no-files-found: ignore

  arch:
    name: Architecture guard
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Check layer and headless rules
        run: .github/scripts/check-arch.sh

  deny:
    name: Dependency policy
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  docs:
    name: Documentation
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link, structure and identifier checks
        run: python3 .github/scripts/check-docs.py

  dco:
    # Pull requests only: the project's own history predates the DCO requirement.
    timeout-minutes: 10
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every PR commit must carry a Signed-off-by trailer
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for commit in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$commit" | grep -q "^Signed-off-by: "; then
              echo "::error::commit $commit is missing a Signed-off-by trailer (see DCO)"
              missing=1
            fi
          done
          exit $missing
