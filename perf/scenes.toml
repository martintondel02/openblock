input = "inputs/idle_10s.input"
preset = "high"
render_distance_blocks = 512
network = "10mbit_40ms"
warmup_s = 0
runs = 3
duration_s = 150

[[scene]]
id = "save"
description = "Region save/load throughput, save pause time and fsync budget on a pregenerated 512-block-radius world."
world = "golden/mixed_512.obworld"
