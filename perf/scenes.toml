# OpenBlock benchmark scene manifest.
#
# Normative definition: docs/spec/25-performance-budgets.md (section 4) and
# docs/spec/24-testing-benchmarks.md. This file is the single scene catalogue:
# a budget row that names a scene absent here fails the manifest load.
# A scene is a reproducible workload: a golden world + input log + preset +
# warm-up + measurement window. Scenes are content-addressed by hash; a changed
# scene hash invalidates its baseline (the harness records instead of gating
# until a new baseline exists).
#
# render_distance_blocks is a block RADIUS, never a diameter: 512 blocks =
# 32-chunk radius = 65x65 = 4,225 columns. simulation_distance_blocks is a
# separate radius and defaults to 256 on dedicated servers (DEC-052).

schema = "openblock.scenes/1"

# --- Windowed scenes (GPU + frame-time gates) ---

[[scene]]
id = "empty"
description = "Empty world, sky and UI only; isolates start-up and pipeline costs."
world = "golden/empty.obworld"
input = "inputs/idle_5s.input"
preset = "high"
render_distance_blocks = 128
warmup_s = 5
runs = 3
duration_s = 10

[[scene]]
id = "flythrough"
description = "120 s fixed-seed flight at 30 blocks/s over mixed terrain with water, forest and a village; the primary 120/144 FPS gate."
world = "golden/mixed_512.obworld"
input = "inputs/flythrough_120s.input"
preset = "high"
render_distance_blocks = 512
warmup_s = 10
runs = 3
duration_s = 120

[[scene]]
id = "tnt"
description = "Chained TNT: 64 explosions, mesh churn, particles, lighting updates and sound storms."
world = "golden/flat_256.obworld"
input = "inputs/tnt_64.64"
preset = "high"
render_distance_blocks = 256
warmup_s = 10
runs = 3
duration_s = 30

[[scene]]
id = "water"
description = "Underwater and surface water rendering with SSR, refraction and translucency."
world = "golden/ocean_512.obworld"
input = "inputs/swim_30s.input"
preset = "high"
render_distance_blocks = 512
warmup_s = 10
runs = 3
duration_s = 30

[[scene]]
id = "cave"
description = "Cave traversal with dynamic lights and lava; stresses lighting, occlusion and translucency."
world = "golden/cave_256.obworld"
input = "inputs/cave_30s.input"
preset = "high"
render_distance_blocks = 256
warmup_s = 10
runs = 3
duration_s = 30

[[scene]]
id = "megabuild"
description = "Large player-built city at a 512-block radius; stresses draw counts, cluster meshing and occlusion."
world = "golden/megabuild_512.obworld"
input = "inputs/city_walk_60s.input"
preset = "high"
render_distance_blocks = 512
warmup_s = 10
runs = 3
duration_s = 60

[[scene]]
id = "ui_stress"
description = "UI-only stress: 46-slot inventory with a full cursor, a 1,000-widget settings page with search open, 100 chat lines, a visible tooltip, 5 toasts and the HUD, at 1080p ui_scale=auto and 4K ui_scale=2."
world = "golden/empty.obworld"
input = "inputs/ui_stress_30s.input"
preset = "high"
render_distance_blocks = 128
warmup_s = 10
runs = 3
duration_s = 30

# --- Headless scenes (server, IO, generation, content) ---

[[scene]]
id = "tick50"
description = "Server tick: 50 co-located bots on the 2,000-column baseline (4,225-column shared-cache bound), 256-block render and simulation distance, mobs and redstone active. 600 ticks = 30 s at 20 Hz."
world = "golden/server_50.obworld"
input = "inputs/tick50_600ticks.input"
preset = "n/a"
simulation_distance_blocks = 256
warmup_s = 10
runs = 3
duration_ticks = 600
tier = "server"

[[scene]]
id = "tick16"
description = "Server reference config: 16 bots, 4 vCPU / 8 GiB, 256-block simulation distance, 20 TPS."
world = "golden/server_16.obworld"
input = "inputs/tick16_3600s.input"
preset = "n/a"
simulation_distance_blocks = 256
warmup_s = 30
runs = 1
duration_s = 3600
tier = "server"

[[scene]]
id = "join"
