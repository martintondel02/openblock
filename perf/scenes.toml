duration_s = 60

# --- Server mods and harness self-tests ---

[[scene]]
id = "mods"
description = "Reference server-side WASM mod set: world read/write, entity spawn, server-computed UI data and scheduled callbacks. No client mod code at 1.0 (DEC-049)."
world = "golden/server_50.obworld"
input = "inputs/tick50_600ticks.input"
preset = "n/a"
simulation_distance_blocks = 256
mods = ["reference/tech", "reference/farming", "reference/minigame"]
warmup_s = 10
runs = 3
duration_s = 120
tier = "server"

[[scene]]
id = "ci"
description = "The PR CI lane: fmt, clippy, tests, docs, arch guard, gated scene subset and benchmark comparison."
world = "n/a"
