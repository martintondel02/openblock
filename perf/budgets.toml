# OpenBlock performance budget manifest.
#
# Normative definition: docs/spec/25-performance-budgets.md (section 4.1).
# The schema is generated from the types in that chapter; a typo in an ID, a
# missing unit, or an unknown scene is a load error, not a silent default.
#
# This file is the seed of the manifest: rows are added milestone by milestone.
# The rule (spec/25 REQ-PERF-001) is that every budget defined in spec/25 has a
# row here before the milestone that must demonstrate it. IDs are append-only;
# a withdrawn budget keeps its ID with status = "withdrawn".
#
# Field values are copied from spec/25 (sections 3.3, 5.1-5.7). Where a single
# budget row states several limits (average + 1% low, or per-player + total),
# the `metric`/`percentile` pair names the primary gated measurement and
# `notes` records the rest. `percentile = 0` on an `fps` metric means the run
# mean (average FPS). Render distances are block radii: 512 blocks =
# 32-chunk radius = 65x65 = 4,225 columns. A scene named here that is absent
# from perf/scenes.toml fails the manifest load.

schema = "openblock.budgets/1"

