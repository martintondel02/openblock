[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/martintondel02/openblock"

# External dependencies are pinned here as each milestone lands; see
# docs/spec/02-engine-core.md and docs/plan/01-milestones.md. Internal path
# dependencies are added per crate when it gains its first code.
[workspace.dependencies]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "split"

[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
