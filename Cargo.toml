[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/martintondel02/openblock"

# External dependencies are pinned here; see docs/decisions.md and
# docs/spec/02-engine-core.md. Internal path dependencies are listed below.
[workspace.dependencies]
glam = { version = "0.34", features = ["bytemuck"] }
wgpu = "30"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
font8x8 = "0.3"
ab_glyph = "0.2.32"
png = "0.18"
rustc-hash = "2"
ctrlc = { version = "3", features = ["termination"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust zstd implementation: the canonical `zstd` crate builds bundled C
# sources through cc-rs, which the Zig-based sandbox wrapper cannot target.
zstd = { package = "zstd-pure-rs", version = "0.2" }

ob_core = { path = "crates/core", version = "1.2.0" }
ob_math = { path = "crates/math", version = "1.2.0" }
ob_content = { path = "crates/content", version = "1.2.0" }
ob_world = { path = "crates/world", version = "1.2.0" }
ob_worldgen = { path = "crates/worldgen", version = "1.2.0" }
ob_sim = { path = "crates/sim", version = "1.2.0" }
ob_protocol = { path = "crates/protocol", version = "1.2.0" }
ob_render = { path = "crates/render", version = "1.2.0" }
ob_audio = { path = "crates/audio", version = "1.2.0" }
ob_server = { path = "crates/server", version = "1.2.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
strip = "symbols"

# The dedicated server unwinds so job/WASM traps can be contained (DEC-042).
[profile.server]
inherits = "release"
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
