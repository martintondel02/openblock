# cargo-deny configuration. Run with `cargo deny check` (see CONTRIBUTING.md).
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
]
confidence-threshold = 0.9
# Fail review when a stale allow-list entry no longer applies.
unused-allowed-license = "warn"

# CDLA-Permissive-2.0 is permissive but deliberately NOT a global allow. The
# policy in ADR-0008 §6 is a package-scoped exception only when a required
# dependency needs it; today that would be `webpki-roots` via an iroh-relay
# tree (research/07 §8.3). Uncomment, keep the scope to that package, and ship
# the CDLA text in the release notices before enabling it.
# [[licenses.exceptions]]
# allow = ["CDLA-Permissive-2.0"]
# name = "webpki-roots"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
